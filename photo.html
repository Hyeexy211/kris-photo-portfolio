<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="seo.photoTitle">Photograph | Kris Photography</title>
    <meta name="description" content="A photograph by Kris Huang." data-i18n-content="seo.photoDescription">
    <meta name="theme-color" content="#000000">
    <link rel="canonical" href="https://hyeexy211.github.io/kris-photo-portfolio/photo.html">
    <meta property="og:title" content="Photograph | Kris Photography" data-i18n-content="seo.photoTitle">
    <meta property="og:description" content="A photograph by Kris Huang." data-i18n-content="seo.photoDescription">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://hyeexy211.github.io/kris-photo-portfolio/images/social/social-cover.png">
    <link rel="icon" href="images/favicon/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="project-site photo-page">
    <a class="skip-link" href="#main-content" data-i18n="common.skipToContent">Skip to content</a>
    <header>
        <nav>
            <a class="site-brand" href="index.html">Kris Photography</a>
            <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="nav-links" aria-expanded="false" aria-label="Open navigation menu" data-i18n-aria-label="nav.openMenu">☰</button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html#home" data-i18n="nav.home">Home</a></li>
                <li><a href="index.html#work" data-i18n="nav.work">Work</a></li>
                <li><a href="index.html#gallery" data-i18n="nav.gallery">Gallery</a></li>
                <li><a href="index.html#about" data-i18n="nav.about">About</a></li>
                <li class="language-switch" role="group" aria-label="Language" data-i18n-aria-label="language.group">
                    <button type="button" data-language="zh-CN" aria-label="Switch to Chinese" data-i18n-aria-label="language.chooseChinese">中文</button>
                    <span aria-hidden="true">/</span>
                    <button type="button" data-language="en" aria-label="Switch to English" data-i18n-aria-label="language.chooseEnglish">EN</button>
                </li>
            </ul>
        </nav>
    </header>
    <main id="main-content" class="project-page">
        <section class="project-hero" aria-labelledby="photo-title">
            <a class="project-back" href="index.html#gallery" data-i18n="photo.backToGallery">← Gallery</a>
            <div class="project-intro">
                <p class="project-category" id="photo-category">Photograph</p>
                <h1 id="photo-title">Loading photograph…</h1>
                <p class="project-description" id="photo-description" hidden></p>
            </div>
        </section>
        <section class="project-gallery" id="photo-content" aria-label="Photograph" data-i18n-aria-label="photo.galleryLabel" aria-busy="true"></section>
        <section class="project-info" id="photo-info" aria-label="Photograph details" data-i18n-aria-label="photo.detailsLabel"></section>
    </main>
    <footer><p data-i18n="footer.copyright">© 2026 Kris Photography</p></footer>
    <script src="js/config/data-source.js"></script>
    <script src="data/collections.js"></script>
    <script src="data/photos.js"></script>
    <script src="js/storage-service.js"></script>
    <script src="js/repositories/local-repository.js"></script>
    <script src="js/config/supabase-client.js"></script>
    <script src="js/repositories/supabase-repository.js"></script>
    <script src="js/content-service.js"></script>
    <script src="locales/en.js"></script>
    <script src="locales/zh-CN.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/photo-page.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
