<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="seo.projects.documentaryTitle">Documentary | Kris Photography</title>
    <meta name="description" content="Quiet interiors, plants and objects observed in soft light. Photography by Kris Huang." data-i18n-content="seo.projects.documentaryDescription">
    <meta name="theme-color" content="#000000">
    <link rel="canonical" href="https://hyeexy211.github.io/kris-photo-portfolio/projects/documentary.html">
    <meta property="og:title" content="Documentary | Kris Photography" data-i18n-content="seo.projects.documentaryTitle">
    <meta property="og:description" content="Quiet interiors, plants and objects observed in soft light." data-i18n-content="seo.projects.documentaryOgDescription">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hyeexy211.github.io/kris-photo-portfolio/projects/documentary.html">
    <meta property="og:image" content="https://hyeexy211.github.io/kris-photo-portfolio/images/social/social-cover.png">
    <link rel="icon" href="../images/favicon/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="project-site">
    <a class="skip-link" href="#main-content" data-i18n="common.skipToContent">Skip to content</a>

    <!-- 子页面用 ../ 返回项目根目录，确保本地和 GitHub Pages 的相对路径都正确。 -->
    <header>
        <nav>
            <a class="site-brand" href="../index.html">Kris Photography</a>
            <button
                class="menu-toggle"
                id="menu-toggle"
                type="button"
                aria-controls="nav-links"
                aria-expanded="false"
                aria-label="Open navigation menu"
                data-i18n-aria-label="nav.openMenu"
            >☰</button>
            <ul class="nav-links" id="nav-links">
                <li><a href="../index.html#home" data-i18n="nav.home">Home</a></li>
                <li><a href="../index.html#work" data-i18n="nav.work">Work</a></li>
                <li><a href="../index.html#about" data-i18n="nav.about">About</a></li>
                <li class="language-switch" role="group" aria-label="Language" data-i18n-aria-label="language.group">
                    <button type="button" data-language="zh-CN" aria-label="Switch to Chinese" data-i18n-aria-label="language.chooseChinese">中文</button>
                    <span aria-hidden="true">/</span>
                    <button type="button" data-language="en" aria-label="Switch to English" data-i18n-aria-label="language.chooseEnglish">EN</button>
                </li>
            </ul>
        </nav>
    </header>

    <main id="main-content" class="project-page">
        <section class="project-hero" aria-labelledby="project-title">
            <a class="project-back" href="../index.html#work" data-i18n="work.backToWork">← All work</a>
            <div class="project-intro">
                <p class="project-category" data-i18n="work.selectedCollection">Selected collection</p>
                <h1 id="project-title">Documentary</h1>
                <p class="project-description" data-i18n="legacy.documentaryDescription">Quiet interiors, plants and objects observed in soft light.</p>
            </div>
        </section>

        <!-- figure 表示一张独立作品；lightbox-trigger 让共用脚本识别可放大的照片。 -->
        <section class="project-gallery" aria-label="Documentary photographs" data-i18n-aria-label="legacy.documentaryGalleryLabel">
            <figure class="project-image">
                <button class="gallery-item lightbox-trigger" type="button" data-id="documentary-001" data-full-src="../images/documentary/documentary-01-1800.webp">
                    <img
                        src="../images/documentary/documentary-01-1200.webp"
                        srcset="../images/documentary/documentary-01-640.webp 640w, ../images/documentary/documentary-01-1200.webp 1200w, ../images/documentary/documentary-01-1800.webp 1800w"
                        sizes="(max-width: 768px) calc(100vw - 40px), calc(100vw - 96px)"
                        width="1200"
                        height="1800"
                        alt="White flowers and a veiled mannequin beside an old window"
                        loading="eager"
                    >
                </button>
            </figure>
            <figure class="project-image">
                <button class="gallery-item lightbox-trigger" type="button" data-id="documentary-002" data-full-src="../images/documentary/documentary-02-1800.webp">
                    <img
                        src="../images/documentary/documentary-02-1200.webp"
                        srcset="../images/documentary/documentary-02-640.webp 640w, ../images/documentary/documentary-02-1200.webp 1200w, ../images/documentary/documentary-02-1800.webp 1800w"
                        sizes="(max-width: 768px) calc(100vw - 40px), calc(100vw - 96px)"
                        width="1200"
                        height="800"
                        alt="Plants and a chandelier in a weathered indoor courtyard"
                        loading="lazy"
                    >
                </button>
            </figure>
            <figure class="project-image">
                <button class="gallery-item lightbox-trigger" type="button" data-id="documentary-003" data-full-src="../images/documentary/documentary-03-1800.webp">
                    <img
                        src="../images/documentary/documentary-03-1200.webp"
                        srcset="../images/documentary/documentary-03-640.webp 640w, ../images/documentary/documentary-03-1200.webp 1200w, ../images/documentary/documentary-03-1800.webp 1800w"
                        sizes="(max-width: 768px) calc(100vw - 40px), calc(100vw - 96px)"
                        width="1200"
                        height="800"
                        alt="Jewelry, mirrors and a painted hand arranged on a table"
                        loading="lazy"
                    >
                </button>
            </figure>
        </section>

        <section class="project-info" aria-label="Collection details" data-i18n-aria-label="work.collectionDetails">
            <div><p class="project-info-label" data-i18n="work.collection">Collection</p><p>Documentary</p></div>
            <div><p class="project-info-label" data-i18n="work.photographs">Photographs</p><p>3</p></div>
            <div><p class="project-info-label" data-i18n="work.photographer">Photographer</p><p>Kris Huang</p></div>
        </section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" data-i18n-aria-label="lightbox.viewer" aria-describedby="lightbox-caption" aria-hidden="true">
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close photo viewer" data-i18n-aria-label="lightbox.close">×</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="View previous photograph" data-i18n-aria-label="lightbox.previous">‹</button>
        <img class="lightbox-image" id="lightbox-image" alt="">
        <p class="lightbox-caption" id="lightbox-caption" aria-live="polite"></p>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="View next photograph" data-i18n-aria-label="lightbox.next">›</button>
    </div>

    <footer><p data-i18n="footer.copyright">© 2026 Kris Photography</p></footer>
    <!-- 旧作品页保留静态图片布局；灯箱按照片 ID 经 Content Service 读取完整资料。 -->
    <script src="../js/config/data-source.js"></script>
    <script src="../data/collections.js"></script>
    <script src="../data/photos.js"></script>
    <script src="../js/storage-service.js"></script>
    <script src="../js/repositories/local-repository.js"></script>
    <script src="../js/config/supabase-client.js"></script>
    <script src="../js/repositories/supabase-repository.js"></script>
    <script src="../js/content-service.js"></script>
    <script src="../locales/en.js"></script>
    <script src="../locales/zh-CN.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
