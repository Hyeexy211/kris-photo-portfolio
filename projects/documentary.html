<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentary | Kris Photography</title>
    <meta name="description" content="Quiet interiors, plants and objects observed in soft light. Photography by Kris Huang.">
    <meta name="theme-color" content="#000000">
    <link rel="canonical" href="https://hyeexy211.github.io/kris-photo-portfolio/projects/documentary.html">
    <meta property="og:title" content="Documentary | Kris Photography">
    <meta property="og:description" content="Quiet interiors, plants and objects observed in soft light.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hyeexy211.github.io/kris-photo-portfolio/projects/documentary.html">
    <meta property="og:image" content="https://hyeexy211.github.io/kris-photo-portfolio/images/social/social-cover.png">
    <link rel="icon" href="../images/favicon/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="project-site">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <!-- 子页面用 ../ 返回项目根目录，确保本地和 GitHub Pages 的相对路径都正确。 -->
    <header>
        <nav>
            <a class="site-brand" href="../index.html">Kris Photography</a>
            <button
                class="menu-toggle"
                id="menu-toggle"
                type="button"
                aria-controls="nav-links"
                aria-expanded="false"
                aria-label="Open navigation menu"
            >☰</button>
            <ul class="nav-links" id="nav-links">
                <li><a href="../index.html#home">Home</a></li>
                <li><a href="../index.html#work">Work</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content" class="project-page">
        <section class="project-hero" aria-labelledby="project-title">
            <a class="project-back" href="../index.html#work">← All work</a>
            <div class="project-intro">
                <p class="project-category">Selected collection</p>
                <h1 id="project-title">Documentary</h1>
                <p class="project-description">Quiet interiors, plants and objects observed in soft light.</p>
            </div>
        </section>

        <!-- figure 表示一张独立作品；lightbox-trigger 让共用脚本识别可放大的照片。 -->
        <section class="project-gallery" aria-label="Documentary photographs">
            <figure class="project-image">
                <button class="gallery-item lightbox-trigger" type="button" data-id="documentary-001" data-full-src="../images/documentary/documentary-01-1800.webp">
                    <img
                        src="../images/documentary/documentary-01-1200.webp"
                        srcset="../images/documentary/documentary-01-640.webp 640w, ../images/documentary/documentary-01-1200.webp 1200w, ../images/documentary/documentary-01-1800.webp 1800w"
                        sizes="(max-width: 768px) calc(100vw - 40px), calc(100vw - 96px)"
                        width="1200"
                        height="1800"
                        alt="White flowers and a veiled mannequin beside an old window"
                        loading="eager"
                    >
                </button>
            </figure>
            <figure class="project-image">
                <button class="gallery-item lightbox-trigger" type="button" data-id="documentary-002" data-full-src="../images/documentary/documentary-02-1800.webp">
                    <img
                        src="../images/documentary/documentary-02-1200.webp"
                        srcset="../images/documentary/documentary-02-640.webp 640w, ../images/documentary/documentary-02-1200.webp 1200w, ../images/documentary/documentary-02-1800.webp 1800w"
                        sizes="(max-width: 768px) calc(100vw - 40px), calc(100vw - 96px)"
                        width="1200"
                        height="800"
                        alt="Plants and a chandelier in a weathered indoor courtyard"
                        loading="lazy"
                    >
                </button>
            </figure>
            <figure class="project-image">
                <button class="gallery-item lightbox-trigger" type="button" data-id="documentary-003" data-full-src="../images/documentary/documentary-03-1800.webp">
                    <img
                        src="../images/documentary/documentary-03-1200.webp"
                        srcset="../images/documentary/documentary-03-640.webp 640w, ../images/documentary/documentary-03-1200.webp 1200w, ../images/documentary/documentary-03-1800.webp 1800w"
                        sizes="(max-width: 768px) calc(100vw - 40px), calc(100vw - 96px)"
                        width="1200"
                        height="800"
                        alt="Jewelry, mirrors and a painted hand arranged on a table"
                        loading="lazy"
                    >
                </button>
            </figure>
        </section>

        <section class="project-info" aria-label="Collection details">
            <div><p class="project-info-label">Collection</p><p>Documentary</p></div>
            <div><p class="project-info-label">Photographs</p><p>3</p></div>
            <div><p class="project-info-label">Photographer</p><p>Kris Huang</p></div>
        </section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-describedby="lightbox-caption" aria-hidden="true">
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close photo viewer">×</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="View previous photograph">‹</button>
        <img class="lightbox-image" id="lightbox-image" alt="">
        <p class="lightbox-caption" id="lightbox-caption" aria-live="polite"></p>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="View next photograph">›</button>
    </div>

    <footer><p>© 2026 Kris Photography</p></footer>
    <!-- 第 23 课：共用 main.js 读取 photos 前，先加载照片数据。 -->
    <script src="../data/photos.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
