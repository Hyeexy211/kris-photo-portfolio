<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landscape | Kris Photography</title>
    <meta name="description" content="Three views of city light, changing skies and a garden path. Photography by Kris Huang.">
    <meta name="theme-color" content="#000000">
    <link rel="canonical" href="https://hyeexy211.github.io/kris-photo-portfolio/projects/landscape.html">
    <meta property="og:title" content="Landscape | Kris Photography">
    <meta property="og:description" content="Three views of city light, changing skies and a garden path.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hyeexy211.github.io/kris-photo-portfolio/projects/landscape.html">
    <meta property="og:image" content="https://hyeexy211.github.io/kris-photo-portfolio/images/social/social-cover.png">
    <link rel="icon" href="../images/favicon/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="project-site">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <!-- 子页面用 ../ 返回项目根目录，确保本地和 GitHub Pages 的相对路径都正确。 -->
    <header>
        <nav>
            <a class="site-brand" href="../index.html">Kris Photography</a>
            <button
                class="menu-toggle"
                id="menu-toggle"
                type="button"
                aria-controls="nav-links"
                aria-expanded="false"
                aria-label="Open navigation menu"
            >☰</button>
            <ul class="nav-links" id="nav-links">
                <li><a href="../index.html#home">Home</a></li>
                <li><a href="../index.html#work">Work</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content" class="project-page">
        <section class="project-hero" aria-labelledby="project-title">
            <a class="project-back" href="../index.html#work">← All work</a>
            <div class="project-intro">
                <p class="project-category">Selected collection</p>
                <h1 id="project-title">Landscape</h1>
                <p class="project-description">Three views of city light, changing skies and a garden path.</p>
            </div>
        </section>

        <!-- figure 表示一张独立作品；button 沿用已有灯箱，支持鼠标和键盘打开。 -->
        <section class="project-gallery" aria-label="Landscape photographs">
            <figure class="project-image">
                <button class="gallery-item" type="button" data-full-src="../images/landscape/landscape-01-1800.webp">
                    <img
                        src="../images/landscape/landscape-01-1200.webp"
                        srcset="../images/landscape/landscape-01-640.webp 640w, ../images/landscape/landscape-01-1200.webp 1200w, ../images/landscape/landscape-01-1800.webp 1800w"
                        sizes="(max-width: 768px) calc(100vw - 40px), calc(100vw - 96px)"
                        width="1200"
                        height="511"
                        alt="City lights beneath a pink dusk sky and silhouetted branches"
                        loading="eager"
                    >
                </button>
            </figure>
            <figure class="project-image">
                <button class="gallery-item" type="button" data-full-src="../images/landscape/landscape-02-1800.webp">
                    <img
                        src="../images/landscape/landscape-02-1200.webp"
                        srcset="../images/landscape/landscape-02-640.webp 640w, ../images/landscape/landscape-02-1200.webp 1200w, ../images/landscape/landscape-02-1800.webp 1800w"
                        sizes="(max-width: 768px) calc(100vw - 40px), calc(100vw - 96px)"
                        width="1200"
                        height="1800"
                        alt="Crescent moon above distant mountains in a purple evening sky"
                        loading="lazy"
                    >
                </button>
            </figure>
            <figure class="project-image">
                <button class="gallery-item" type="button" data-full-src="../images/landscape/landscape-03-1800.webp">
                    <img
                        src="../images/landscape/landscape-03-1200.webp"
                        srcset="../images/landscape/landscape-03-640.webp 640w, ../images/landscape/landscape-03-1200.webp 1200w, ../images/landscape/landscape-03-1800.webp 1800w"
                        sizes="(max-width: 768px) calc(100vw - 40px), calc(100vw - 96px)"
                        width="1200"
                        height="600"
                        alt="Stone steps lead through a wooden gate framed by pink flowers"
                        loading="lazy"
                    >
                </button>
            </figure>
        </section>

        <section class="project-info" aria-label="Collection details">
            <div><p class="project-info-label">Collection</p><p>Landscape</p></div>
            <div><p class="project-info-label">Photographs</p><p>3</p></div>
            <div><p class="project-info-label">Photographer</p><p>Kris Huang</p></div>
        </section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close photo viewer">×</button>
        <img class="lightbox-image" id="lightbox-image" alt="">
    </div>

    <footer><p>© 2026 Kris Photography</p></footer>
    <script src="../js/main.js"></script>
</body>
</html>
