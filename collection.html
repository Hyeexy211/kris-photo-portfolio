<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection | Kris Photography</title>
    <meta name="description" content="A photography collection by Kris Huang.">
    <meta name="theme-color" content="#000000">
    <link rel="canonical" href="https://hyeexy211.github.io/kris-photo-portfolio/collection.html">
    <meta property="og:title" content="Collection | Kris Photography">
    <meta property="og:description" content="A photography collection by Kris Huang.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hyeexy211.github.io/kris-photo-portfolio/collection.html">
    <meta property="og:image" content="https://hyeexy211.github.io/kris-photo-portfolio/images/social/social-cover.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Collection | Kris Photography">
    <meta name="twitter:description" content="A photography collection by Kris Huang.">
    <meta name="twitter:image" content="https://hyeexy211.github.io/kris-photo-portfolio/images/social/social-cover.png">
    <link rel="icon" href="images/favicon/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="project-site">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header>
        <nav>
            <a class="site-brand" href="index.html">Kris Photography</a>
            <button
                class="menu-toggle"
                id="menu-toggle"
                type="button"
                aria-controls="nav-links"
                aria-expanded="false"
                aria-label="Open navigation menu"
            >☰</button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#work">Work</a></li>
                <li><a href="index.html#gallery">Gallery</a></li>
                <li><a href="index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content" class="project-page">
        <section class="project-hero" aria-labelledby="collection-title">
            <a class="project-back" href="index.html#work">← All work</a>
            <div class="project-intro">
                <p class="project-category">Selected collection</p>
                <h1 id="collection-title">Collection</h1>
                <p class="project-description" id="collection-description">Loading collection…</p>
            </div>
        </section>

        <section class="project-gallery" id="collection-gallery" aria-label="Collection photographs"></section>
        <section class="project-info" id="collection-info" aria-label="Collection details"></section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close photo viewer">×</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="View previous photograph">‹</button>
        <img class="lightbox-image" id="lightbox-image" alt="">
        <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="View next photograph">›</button>
    </div>

    <footer><p>© 2026 Kris Photography</p></footer>

    <script src="js/config/data-source.js"></script>
    <script src="data/collections.js"></script>
    <script src="data/photos.js"></script>
    <script src="js/storage-service.js"></script>
    <script src="js/repositories/local-repository.js"></script>
    <script src="js/config/supabase-client.js"></script>
    <script src="js/repositories/supabase-repository.js"></script>
    <script src="js/content-service.js"></script>
    <!-- 先生成照片按钮，main.js 随后读取这些按钮并接入现有 Lightbox。 -->
    <script src="js/collection-page.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
